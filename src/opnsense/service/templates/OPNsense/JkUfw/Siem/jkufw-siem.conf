{#
 # jk-ufw: copies of the logs for a SIEM / log collector, in CEF, JSON or RFC 5424.
 # Settings: OPNsense.JkUfw.ddos.siem.target (page Firewall > Attack Protection > SIEM).
 #
 # Firewall log lines (filterlog, CSV) are taken apart, so CEF and JSON carry source, destination,
 # ports, action and interface as separate fields. IDS alerts (suricata) get signature, class and
 # priority. Everything else is sent with the program name and the message text.
 #}
{% set targets = [] %}
{% for t in helpers.toList('OPNsense.JkUfw.ddos.siem.target') %}
{%   if t.enabled|default('0') == '1' and t.host|default('') != '' %}
{%     do targets.append(t) %}
{%   endif %}
{% endfor %}
{% if targets %}
# jk-ufw: log export to SIEM (generated, do not edit)

filter f_jkufw_firewall { program("filterlog"); };
filter f_jkufw_ids { program("suricata"); };
filter f_jkufw_security { program("jkufw-ddos") or program("sshlockout") or program("captiveportal"); };
filter f_jkufw_auth { program("audit") or facility(auth) or facility(authpriv); };
filter f_jkufw_system {
    not program("filterlog") and not program("suricata") and not program("jkufw-ddos")
    and not program("sshlockout") and not program("captiveportal") and not program("audit")
    and not facility(auth) and not facility(authpriv) and level(info..emerg);
};
filter f_jkufw_v4 { message(",(in|out),4,", type(pcre)); };
filter f_jkufw_ports { "${fw.proto}" eq "tcp" or "${fw.proto}" eq "udp"; };

# filterlog: rule,subrule,anchor,label,interface,reason,action,direction,ipversion,...
parser p_jkufw_fw4 {
    csv-parser(
        columns("fw.rule", "fw.subrule", "fw.anchor", "fw.label", "fw.iface", "fw.reason", "fw.action", "fw.dir",
                "fw.ipver", "fw.tos", "fw.ecn", "fw.ttl", "fw.id", "fw.offset", "fw.flags", "fw.protonum",
                "fw.proto", "fw.length", "fw.src", "fw.dst", "fw.rest")
        delimiters(",") flags(greedy) quote-pairs('')
    );
};
parser p_jkufw_fw6 {
    csv-parser(
        columns("fw.rule", "fw.subrule", "fw.anchor", "fw.label", "fw.iface", "fw.reason", "fw.action", "fw.dir",
                "fw.ipver", "fw.class", "fw.flowlabel", "fw.ttl", "fw.proto", "fw.protonum", "fw.length",
                "fw.src", "fw.dst", "fw.rest")
        delimiters(",") flags(greedy) quote-pairs('')
    );
};
parser p_jkufw_ports {
    csv-parser(columns("fw.sport", "fw.dport", "fw.more") delimiters(",") flags(greedy) quote-pairs('') template("${fw.rest}"));
};
# "[1:2010935:3] ET SCAN ... [Classification: ...] [Priority: 2] {TCP} 1.2.3.4:5 -> 6.7.8.9:80"
parser p_jkufw_ids {
    regexp-parser(
        patterns('\[(?<sid>[0-9]+:[0-9]+:[0-9]+)\] (?<sig>.*?) \[Classification: (?<class>[^\]]*)\] \[Priority: (?<prio>[0-9]+)\] \{(?<proto>[^}]*)\} (?<src>\S+) -> (?<dst>\S+)')
        prefix("ids.")
    );
};
template t_jkufw_cef {
    template("<${PRI}>${DATE} ${HOST} ${cef.line}\n");
};
template t_jkufw_json {
    template("<${PRI}>${DATE} ${HOST} ${PROGRAM}: $(format-json --key-delimiter . timestamp=${ISODATE} host=${HOST} program=${PROGRAM} pid=${PID} facility=${FACILITY} severity=${LEVEL} message=${MSG} --key fw.* --key ids.* --exclude fw.rest --exclude fw.more)\n");
};

log {
    source(s_all);
    # CEF extension values: escape \ and =, no line breaks
    rewrite {
        set("${MSG}", value("cef.msg"));
        subst('\\', '\\\\', value("cef.msg"), flags(global));
        subst('=', '\=', value("cef.msg"), flags(global));
        subst('[\r\n]', ' ', value("cef.msg"), type(pcre), flags(global));
        set("3", value("cef.sev"));
    };
    if {
        filter(f_jkufw_firewall);
        if { filter(f_jkufw_v4); parser(p_jkufw_fw4); } else { parser(p_jkufw_fw6); };
        if { filter(f_jkufw_ports); parser(p_jkufw_ports); };
        if { filter { "${fw.action}" eq "block" }; rewrite { set("5", value("cef.sev")); }; }
        else { rewrite { set("1", value("cef.sev")); }; };
        rewrite {
            set("CEF:0|jk-ufw|firewall|1.0|fw-${fw.action}|Firewall ${fw.action} ${fw.dir}|${cef.sev}|act=${fw.action} deviceDirection=$(if ('${fw.dir}' eq 'out') '1' '0') deviceInboundInterface=${fw.iface} src=${fw.src} dst=${fw.dst} spt=${fw.sport} dpt=${fw.dport} proto=${fw.proto} cs1Label=ruleLabel cs1=${fw.label} cn1Label=ruleNumber cn1=${fw.rule} rt=${UNIXTIME}000 dvchost=${HOST}", value("cef.line"));
        };
    } elif {
        filter(f_jkufw_ids);
        parser(p_jkufw_ids);
        rewrite {
            set("${ids.sig}", value("cef.sig"));
            subst('\|', '\\|', value("cef.sig"), type(pcre), flags(global));
            set("4", value("cef.sev"));
        };
        if { filter { "${ids.prio}" == "1" }; rewrite { set("9", value("cef.sev")); }; }
        elif { filter { "${ids.prio}" == "2" }; rewrite { set("7", value("cef.sev")); }; };
        rewrite {
            set("CEF:0|jk-ufw|ids|1.0|${ids.sid}|${cef.sig}|${cef.sev}|cat=${ids.class} proto=${ids.proto} cs2Label=source cs2=${ids.src} cs3Label=destination cs3=${ids.dst} msg=${cef.msg} rt=${UNIXTIME}000 dvchost=${HOST}", value("cef.line"));
        };
    } else {
        if { filter { level(emerg..err) }; rewrite { set("8", value("cef.sev")); }; }
        elif { filter { level(warning) }; rewrite { set("6", value("cef.sev")); }; };
        rewrite {
            set("CEF:0|jk-ufw|${PROGRAM}|1.0|${PROGRAM}|${PROGRAM} ${LEVEL}|${cef.sev}|msg=${cef.msg} rt=${UNIXTIME}000 dvchost=${HOST} deviceFacility=${FACILITY}", value("cef.line"));
        };
    };
{%   for t in targets %}
{%     set key = t['@uuid']|replace('-', '') %}
{%     set logs = t.logs|default('')|string %}
    log {
        filter {
            {% for kind in logs.split(',') if kind in ['firewall', 'ids', 'security', 'auth', 'system'] -%}
            {{ 'or ' if not loop.first }}filter(f_jkufw_{{ kind }})
            {% else -%}
            program("jkufw-none")
            {% endfor %}
        };
        destination {
            network("{{ t.host }}"
                transport("{{ t.transport[:3] }}")
                port({{ t.port|default('514') }})
                ip-protocol({{ '6' if t.transport[3:] == '6' else '4' }})
{%     if t.format == 'rfc5424' %}
                flags(syslog-protocol)
{%     elif t.format == 'json' %}
                template(t_jkufw_json)
{%     else %}
                template(t_jkufw_cef)
{%     endif %}
                persist-name("jkufw_siem_{{ key }}")
            );
        };
    };
{%   endfor %}
};
{% endif %}
